name: TIOBE

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 7 * * 0'

permissions: {}

jobs:
  TICS:
    runs-on: [self-hosted, reactive, amd64, tiobe, noble]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

        # We could store the coverage report from the regular run, but this is cheap to do
        # and keeps this isolated.
      - name: Run unit tests
        run: |
          make unit
          mkdir .report
          uvx coverage xml -o .report/coverage.xml

        # Note that these are dependencies for the tools that the TIOBE action will run,
        # which is done in the global environment, rather than a venv, as we do with the
        # unit tests.
      - name: Install dependencies
        run: |
          uv export --no-emit-project --frozen --no-hashes > requirements.txt
          pip install flake8 pylint -r requirements.txt --break-system-packages

      - name: TICS GitHub Action
        uses: tiobe/tics-github-action@48afe561ae55edd1e1ec484505dba636e90ba0a6  # v4.1.0
        with:
          mode: qserver
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          project: jubilant
          installTics: true

  open-issue-on-failure-if-scheduled:
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: [TICS]
    permissions:
      issues: write
      actions: read  # for ai-failure-enrich.yaml
    secrets:
      # For ai-failure-enrich.yaml -- can only be read in the ai-failure-triage environment.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    uses: $/.github/workflows/notify-scheduled-failure.yaml
